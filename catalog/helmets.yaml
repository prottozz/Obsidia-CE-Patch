# Core combat helmets plus Royalty / Biotech / Anomaly variants. Set ids match catalog/armor.yaml
# where a kit has both.
sets:
  - id: proto
    rung: proto
    members:
      - defName: OE_Helmet_Proto
  - id: occ
    rung: occ
    members:
      - defName: OCC_Helmet
      - defName: OCC_Helmet_M
        rung: occ_reforge
      - defName: OCC_Helmet_M_Spacer
        rung: occ_reforge
      - defName: OCC_Helmet_M_Melee
        rung: occ_reforge
      - defName: OCC_Helmet_M_Ranged
        rung: occ_reforge
      - defName: OCC_Helmet_M_Mechanitor
        rung: occ_reforge
        mayRequire: Ludeon.RimWorld.Biotech
  - id: otc
    rung: otc
    members:
      - defName: OTC_Helmet
      - defName: OTC_Helmet_M
        rung: otc_t2
      - defName: OTC_Helmet_M_Spacer
        rung: otc_t2
      - defName: OTC_Helmet_M_Melee
        rung: otc_t2
      - defName: OTC_Helmet_M_Ranged
        rung: otc_t2
      - defName: OTC_Helmet_M_Mechanitor
        rung: otc_t2
        mayRequire: Ludeon.RimWorld.Biotech
  - id: omc
    rung: omc
    members:
      - defName: OMC_Helmet
      - defName: OMC_Helmet_M
        rung: omc_mod
      - defName: OMC_Helmet_M_Spacer
        rung: omc_mod
      - defName: OMC_Helmet_M_Melee
        rung: omc_mod
      - defName: OMC_Helmet_M_Ranged
        rung: omc_mod
      - defName: OMC_Helmet_M_Mechanitor
        rung: omc_mod
        mayRequire: Ludeon.RimWorld.Biotech
  - id: odc_nomad
    rung: odc_t1
    members:
      - defName: ODC_Helmet_Nomad
  - id: odc_recon
    rung: odc_t2
    members:
      - defName: ODC_Helmet_Recon
      - defName: ODC_Helmet_Spacer
      - defName: ODC_Helmet_Prestige
        mayRequire: Ludeon.RimWorld.Royalty
      # Tagged for both Recon and Duelist mechanitors, same call as Prestige.
      - defName: ODC_Helmet_Mechanitor
        mayRequire: Ludeon.RimWorld.Biotech
  - id: odc_duelist
    rung: odc_t3
    members:
      - defName: ODC_Helmet_Duelist
  - id: cac_light
    rung: cac_t1
    members:
      - defName: CAC_LightHelmet
      - defName: CAC_LightHelmet_Prestige
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: CAC_LightHelmet_Mechanitor
        mayRequire: Ludeon.RimWorld.Biotech
  - id: cac_heavy
    rung: cac_t2
    members:
      - defName: CAC_HeavyHelmet
      - defName: CAC_HeavyHelmet_Prestige
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: CAC_HeavyHelmet_Mechanitor
        mayRequire: Ludeon.RimWorld.Biotech
  - id: cac_priest
    rung: cac_t2
    mayRequire: Ludeon.RimWorld.Anomaly
    members:
      - defName: CAC_PriestHelmet
  - id: ego
    rung: bio_t3
    members:
      - defName: EGO_Helmet_Mask
      - defName: EGO_Helmet_Helm
      - defName: EGO_Helmet_Exohelm_Melee
        rung: bio_t4
      - defName: EGO_Helmet_Exohelm_Ranged
        rung: bio_t4
      - defName: EGO_Helmet_Exohelm_Psy
        rung: bio_t4
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: EGO_Helmet_Exohelm_Mechanitor
        rung: bio_t4
        mayRequire: Ludeon.RimWorld.Biotech
  - id: oes
    rung: heroic
    members:
      - defName: OES_Helmet_Melee
      - defName: OES_Helmet_Ranged
  - id: omg
    rung: omg
    members:
      - defName: OMG_Helmet_Classic
      - defName: OMG_Trophy_Helmet_Forgemind
      - defName: OMG_Trophy_Helmet_Hellrain
      - defName: OMG_Trophy_Helmet_Orbicore
      - defName: OMG_Trophy_Helmet_Neuroflash
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: OMG_Trophy_Helmet_Mindtwister
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: OMG_Trophy_Helmet_Gasveil
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: OMG_Trophy_Helmet_Firemark
        mayRequire: Ludeon.RimWorld.Anomaly
      - defName: OMG_Trophy_Helmet_Fleshcrafter
        mayRequire: Ludeon.RimWorld.Anomaly
      - defName: OMG_Trophy_Helmet_Necrospark
        mayRequire: Ludeon.RimWorld.Anomaly
  - id: oec
    rung: oec
    mayRequire: Ludeon.RimWorld.Royalty
    members:
      - defName: OEC_Helmet
      - defName: OEC_Helmet_M
        rung: oec_t2
      - defName: OEC_Helmet_M_Spacer
        rung: oec_t2
      - defName: OEC_Helmet_M_Melee
        rung: oec_t2
      - defName: OEC_Helmet_M_Ranged
        rung: oec_t2
  - id: kid
    rung: proto
    mayRequire: Ludeon.RimWorld.Biotech
    members:
      - defName: OE_Helmet_Kid
        mass: 1.8
        bulk: 2.5
      - defName: OE_Helmet_Kid_Spacer
        mass: 1.8
        bulk: 2.5
