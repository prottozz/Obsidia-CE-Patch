# Obsidia turret guns. type / class / rung feed the gun pipeline (caliber, damage
# class, stats); magazine = Obsidia OE_AmmoKit fuelCapacity of the fueled turret using
# the gun, kitShots = its fuelMultiplier (shots per kit, used by the ammo-network
# bridge). Guns whose turrets never used ammo omit both and get no CE magazine.
guns:
  - defName: CAC_Gun_TacticalTurret
    type: shotgun
    class: ballistic
    rung: cac_t1
    magazine: 100
    kitShots: 5
  - defName: CAC_TurretGun_Big
    type: minigun
    class: ballistic
    rung: cac_t2
    magazine: 850
    kitShots: 8.45
  - defName: CAC_TurretGun_Small
    type: sniper
    class: ballistic
    rung: cac_t1
    magazine: 250
    kitShots: 1.43
