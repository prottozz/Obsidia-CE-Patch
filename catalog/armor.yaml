      - defName: CAC_HeavyArmor_Smoker
      - defName: CAC_HeavyArmor_Jump
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: CAC_HeavyArmor_Prestige
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: CAC_HeavyArmor_Mechanitor
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: CAC_HeavyArmor_Turret
        mayRequire: Ludeon.RimWorld.Anomaly
      - defName: CAC_HeavyArmor_Swarmling
        mayRequire: Ludeon.RimWorld.Odyssey
  # Anomaly priest kit: vanilla 1.85 Sharp sits between CAC heavy and OMG.
  - id: cac_priest
    rung: cac_t2
    mayRequire: Ludeon.RimWorld.Anomaly
    members:
      - defName: CAC_PriestArmor
  - id: ego
    rung: bio_t3
    members:
      - defName: EGO_Armor_Suit
      - defName: EGO_Armor_Carapace
      - defName: EGO_Armor_Shell_Melee
        rung: bio_t4
      - defName: EGO_Armor_Shell_Ranged
        rung: bio_t4
      - defName: EGO_Armor_Shell_Psy
        rung: bio_t4
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: EGO_Armor_Shell_Mechanitor
        rung: bio_t4
        mayRequire: Ludeon.RimWorld.Biotech
  - id: omg
    rung: omg
    members:
      - defName: OMG_Armor_Corsair
      - defName: OMG_Armor_Demolition
      - defName: OMG_Armor_Commando
        mayRequire: Ludeon.RimWorld.Anomaly
      - defName: OMG_Armor_Swarmling
        mayRequire: Ludeon.RimWorld.Odyssey
  - id: oec
    rung: oec
    mayRequire: Ludeon.RimWorld.Royalty
    members:
      - defName: OEC_Armor
      - defName: OEC_Armor_M
        rung: oec_t2
      - defName: OEC_Armor_M_Spacer
        rung: oec_t2
      - defName: OEC_Armor_M_Smoker
        rung: oec_t2
      - defName: OEC_Armor_M_Jump
        rung: oec_t2
  # Biotech child armor: proto plate at ~0.6x proto weight (vanilla kid 5 kg vs proto 8.5 kg).
  - id: kid
    rung: proto
    mayRequire: Ludeon.RimWorld.Biotech
    members:
      - defName: OE_Armor_Kid
        mass: 18
        bulk: 50
        wornBulk: 7
      - defName: OE_Armor_Kid_Spacer
        mass: 18
        bulk: 50
        wornBulk: 7
