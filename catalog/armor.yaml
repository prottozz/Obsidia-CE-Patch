# Core combat body armor plus Royalty / Biotech / Anomaly / Odyssey variants. Rung names match the gun
# catalog; numbers come from Tools/oe_ce/apparel_rungs.py, not the gun table.
sets:
  - id: proto
    rung: proto
    members:
      - defName: OE_Armor_Proto
  - id: occ
    rung: occ
    members:
      - defName: OCC_Armor
      - defName: OCC_Armor_M
        rung: occ_reforge
      - defName: OCC_Armor_M_Spacer
        rung: occ_reforge
      - defName: OCC_Armor_M_Jump
        rung: occ_reforge
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: OCC_Armor_M_ForceField
        rung: occ_reforge
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: OCC_Armor_M_Mechanitor
        rung: occ_reforge
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: OCC_Armor_M_Turret
        rung: occ_reforge
        mayRequire: Ludeon.RimWorld.Anomaly
  - id: otc
    rung: otc
    members:
      - defName: OTC_Armor
      - defName: OTC_Armor_M
        rung: otc_t2
      - defName: OTC_Armor_M_Spacer
        rung: otc_t2
      - defName: OTC_Armor_M_Mechanitor
        rung: otc_t2
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: OTC_Armor_M_Turret
        rung: otc_t2
        mayRequire: Ludeon.RimWorld.Anomaly
  - id: omc
    rung: omc
    members:
      - defName: OMC_Armor
      - defName: OMC_Armor_M
        rung: omc_mod
      - defName: OMC_Armor_M_Spacer
        rung: omc_mod
      - defName: OMC_Armor_M_Smoker
        rung: omc_mod
      - defName: OMC_Armor_M_Jump
        rung: omc_mod
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: OMC_Armor_M_ForceField
        rung: omc_mod
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: OMC_Armor_M_Mechanitor
        rung: omc_mod
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: OMC_Armor_M_Turret
        rung: omc_mod
        mayRequire: Ludeon.RimWorld.Anomaly
  - id: odc_nomad
    rung: odc_t1
    members:
      - defName: ODC_Armor_Nomad
  - id: odc_recon
    rung: odc_t2
    members:
      - defName: ODC_Armor_Recon
      - defName: ODC_Armor_Recon_Spacer
      - defName: ODC_Armor_Recon_Smoker
      - defName: ODC_Armor_Recon_Jump
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: ODC_Armor_Recon_Prestige
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: ODC_Armor_Recon_Mechanitor
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: ODC_Armor_Recon_Turret
        mayRequire: Ludeon.RimWorld.Anomaly
  - id: odc_duelist
    rung: odc_t3
    members:
      - defName: ODC_Armor_Duelist
      - defName: ODC_Armor_Duelist_Spacer
      - defName: ODC_Armor_Duelist_Smoker
      - defName: ODC_Armor_Duelist_Jump
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: ODC_Armor_Duelist_Prestige
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: ODC_Armor_Duelist_Mechanitor
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: ODC_Armor_Duelist_Turret
        mayRequire: Ludeon.RimWorld.Anomaly
  - id: odc_stalker
    rung: odc_t4
    members:
      - defName: ODC_Armor_Stalker_Direwolf
      - defName: ODC_Armor_Stalker_Raptor
      - defName: ODC_Armor_Stalker_Ogren
      - defName: ODC_Armor_Stalker_Tionant
  - id: cac_light
    rung: cac_t1
    members:
      - defName: CAC_LightArmor
      - defName: CAC_LightArmor_Smoker
      - defName: CAC_LightArmor_Jump
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: CAC_LightArmor_Prestige
        mayRequire: Ludeon.RimWorld.Royalty
      - defName: CAC_LightArmor_Mechanitor
        mayRequire: Ludeon.RimWorld.Biotech
      - defName: CAC_LightArmor_Turret
        mayRequire: Ludeon.RimWorld.Anomaly
      - defName: CAC_LightArmor_Swarmling
        mayRequire: Ludeon.RimWorld.Odyssey
  - id: cac_heavy
    rung: cac_t2
    members:
